{{- if not .Values.github.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "teriac.githubSecretName" . }}
  labels:
    {{- include "teriac.labels" . | nindent 4 }}
type: Opaque
stringData:
  private-key: {{ .Values.github.privateKey | quote }}
  webhook-secret: {{ .Values.github.webhookSecret | quote }}
  {{- with .Values.github.clientSecret }}
  client-secret: {{ . | quote }}
  {{- end }}
  {{- with .Values.github.privateKeyNext }}
  private-key-next: {{ . | quote }}
  {{- end }}
  {{- with .Values.github.webhookSecretNext }}
  webhook-secret-next: {{ . | quote }}
  {{- end }}
{{- end }}
